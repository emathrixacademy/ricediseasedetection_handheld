; PlatformIO project config — points at the esp32/ subtree.
; Build/upload from repo root:  pio run -d esp32 --target upload
; Or cd esp32 && pio run --target upload
[platformio]
src_dir = esp32/src
lib_dir = esp32/lib

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    adafruit/Adafruit MCP4725@^2.0.0
    adafruit/Adafruit ADS1X15@^2.4.0
    Wire
